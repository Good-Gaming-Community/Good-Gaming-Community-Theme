name: Release Plugin

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  release:
    if: contains(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION=$(jq -r .version plugin.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create tag (if not exists)
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "Tag already exists"
          else
            git tag v${{ steps.version.outputs.version }}
            git push origin v${{ steps.version.outputs.version }}
          fi

      - name: Build ZIP
        run: |
          zip -r Good-Gaming-Community-Theme.zip plugin.json update.json src

      - name: Update update.json
        run: |
          jq --arg v "${{ steps.version.outputs.version }}" \
             --arg url "https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/Good-Gaming-Community-Theme.zip" \
             '.["*"] = {version: $v, download_url: $url}' update.json > tmp.json && mv tmp.json update.json

      - name: Commit update.json
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add update.json
          git commit -m "chore: update update.json" || echo "No changes"
          git push

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: Good-Gaming-Community-Theme.zip
